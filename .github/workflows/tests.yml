name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # tests/test_frozen_forecast.py compares against commit 99a2305, so it needs full history
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          # requirements-lock.txt was built and verified on Python 3.13
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: pip install -r requirements-lock.txt
      - run: pytest -q
